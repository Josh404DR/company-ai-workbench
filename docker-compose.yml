version: '3.8'

services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company-ai-workbench
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - workbench_data:/data
      - .:/workspace
    environment:
      - WORKBENCH_DB=/data/workbench.db
      - WORKBENCH_NODE_PATH=/usr/bin/node
      - PYTHONUNBUFFERED=1
    working_dir: /workspace

volumes:
  workbench_data:
    driver: local
