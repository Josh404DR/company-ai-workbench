name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & Invariant Verification (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Set up Node.js 20 (for runner support)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git for Test Sandboxing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run Full Test Suite (135 Tests)
        shell: bash
        run: |
          export PYTHONPATH="src:prototype:$PYTHONPATH"
          python -m pytest tests -v

      - name: Run Extreme Architecture Council Penetration Tests
        shell: bash
        run: |
          export PYTHONPATH="src:prototype:$PYTHONPATH"
          python -m pytest tests/test_extreme_council.py -v

  invariant-gate:
    name: Engine Constitution Invariants Gate
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Audit Constitution Invariants
        shell: bash
        run: |
          export PYTHONPATH="src:prototype:$PYTHONPATH"
          # Invariant 9: Mainline Delivery Gate
          # Invariant 11: Verifier Independence
          # Invariant 14: Tiered Acceptance Authority
          python -m pytest tests/test_governance.py tests/test_extreme_council.py tests/test_delivery.py -v
